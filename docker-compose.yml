version: '3.8'

services:
  # MongoDB for helpdesk backend
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: helpdesk
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  # Milvus vector database for chatbot
  milvus:
    image: milvusdb/milvus:v2.5.5
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 20s bash -c ':> /dev/tcp/127.0.0.1/19530' || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks:
      - app-network

  # Etcd for Milvus
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd
    environment:
      ETCD_NAME: node1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: node1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster-1
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  # MinIO for Milvus
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  # Helpdesk Backend
  helpdesk-backend:
    build:
      context: ./helpdesk-backend
      dockerfile: Dockerfile
    container_name: helpdesk-backend
    environment:
      NODE_ENV: production
      PORT: 5500
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/helpdesk?authSource=admin
      JWT_SECRET: secret_token
      JWT_EXPIRES_IN: 7d
      JWT_COOKIE_EXPIRES_IN: 1
      REFRESH_TOKEN_SECRET: your_refresh_token_secret
      REFRESH_TOKEN_EXPIRES_IN: 30d
      API_KEY_SECRET: chatbot_server_api_key_12345
      EMAIL_SERVICE: gmail
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: timblaron5@gmail.com
      EMAIL_PASSWORD: bawkyuzdbkwytzyw
      EMAIL_FROM: timblaron5@gmail.com
      EMAIL_FROM_NAME: Campus Support
      STORAGE_TYPE: local
      STORAGE_PATH: ./uploads
      FRONTEND_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001,http://localhost:3000
    ports:
      - "5500:5500"
    depends_on:
      - mongodb
    networks:
      - app-network
    develop:
      watch:
        # Sync source code changes including package.json
        - action: sync
          path: ./helpdesk-backend
          target: /app
          ignore:
            - node_modules/
            - logs/
            - uploads/
            - .git/
            - "*.log"
        - action: rebuild
          path: ./helpdesk-backend/package.json

  # Chatbot Data Service
  chatbot-data-service:
    build:
      context: ./chatbot-data-service
      dockerfile: Dockerfile
    container_name: chatbot-data-service
    environment:
      NODE_ENV: production
      PORT: 5502
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      COLLECTION_NAME: test
      FORCE_RECREATE_COLLECTION: false
      OPENAI_API_KEY: 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
      OPENAI_MODEL: text-embedding-3-small
      # Retry configuration
      MILVUS_MAX_RETRIES: 15
      MILVUS_RETRY_DELAY: 5000
      SERVICE_INIT_MAX_RETRIES: 5
      SERVICE_INIT_RETRY_DELAY: 10000
      BACKGROUND_RETRY_INTERVAL: 30000
    ports:
      - "5502:5502"
    depends_on:
      milvus:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./chatbot-data-service
          target: /app
          ignore:
            - node_modules/
            - uploads/
            - .git/
            - "*.log"
        - action: rebuild
          path: ./chatbot-data-service/package.json

  # Chatbot Server (WebSocket)
  chatbot-server:
    build:
      context: ./chatbot-server
      dockerfile: Dockerfile
    container_name: chatbot-server
    environment:
      NODE_ENV: production
      PORT: 5501
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/helpdesk?authSource=admin
      BACKEND_API_URL: http://helpdesk-backend:5500/api/v1
      HELPDESK_API_URL: http://helpdesk-backend:5500
    ports:
      - "5501:5501"
    depends_on:
      - mongodb
      - helpdesk-backend
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./chatbot-server
          target: /app
          ignore:
            - node_modules/
            - .git/
            - "*.log"
        - action: rebuild
          path: ./chatbot-server/package.json

  # Rasa Backend
  rasa-backend:
    build:
      context: ./rasa-backend
      dockerfile: Dockerfile
    container_name: rasa-backend
    environment:
      OPENAI_API_KEY: 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
      RASA_PRO_LICENSE: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiJkOGQ5MTI1OS1mNWFhLTRiMTEtYTYxNC05MGJkYzI3MTA5NTEiLCJpYXQiOjE3MzQ3MzY0MDksIm5iZiI6MTczNDczNjQwNSwic2NvcGUiOiJyYXNhOnBybyByYXNhOnBybzpjaGFtcGlvbiByYXNhOnZvaWNlIiwiZXhwIjoxODI5MzQ0NDA1LCJlbWFpbCI6InJvbmFsZG1hdGltYmFAb3V0bG9vay5jb20iLCJjb21wYW55IjoiUmFzYSBDaGFtcGlvbnMifQ.sRAOo8s0X0xvoC8cM_NshXq3zX_3-CaoM-vJlOfPLrAUXg7mmgqbaGybXcHB38vofpVuwIr-Qu7iwXZ22wKBdZ-PuHsQrSGK-O-eDGct0UxHVl_gf5700nrfaPYkHABr4ZaqGCDCL0kwDedEkLaSQ4kkjYJmmJkTya1TcUMjXoq0uC6h3Z57CWyJ7iswjefqjWNI9GOeUWw3uZ6GscxvGw8faazm5hYxnBC9b91hFBHPW5-KvWvCWE4E9FS8qSmckdOIChMyGpvSvX3JJs5vQV5S24SgsA_CzzoY7t169cFsAdIuBl8q9SnFcRlk3c7UJbx3kLHWVCnDgp-Rm-3kyw
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      HELPDESK_API_URL: http://helpdesk-backend:5500
    ports:
      - "5005:5005"  # Rasa server & actions server
    depends_on:
      milvus:
        condition: service_healthy
      helpdesk-backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network
    develop:
      watch:
        # Sync Python files and configurations
        - action: sync
          path: ./rasa-backend
          target: /app
          ignore:
            - __pycache__/
            - "*.pyc"
            - models/
            - .git/
        # Rebuild when training data or config changes
        - action: rebuild
          path: ./rasa-backend/data/
        - action: rebuild
          path: ./rasa-backend/domain/
        - action: rebuild
          path: ./rasa-backend/config.yml

  # Chatbot Frontend
  chatbot-frontend:
    build:
      context: ./chatbot-frontend
      dockerfile: Dockerfile
    container_name: chatbot-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_RASA_URL: http://localhost:5005
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5501
    ports:
      - "3000:3000"
    depends_on:
      - rasa-backend
      - chatbot-server
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./chatbot-frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - "*.log"
        - action: rebuild
          path: ./chatbot-frontend/package.json
        - action: rebuild
          path: ./chatbot-frontend/next.config.mjs

  # Helpdesk Frontend
  helpdesk-frontend:
    build:
      context: ./helpdesk-frontend
      dockerfile: Dockerfile
    container_name: helpdesk-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5500/api/v1
      NEXT_PUBLIC_SOCKET_SERVER_URL: http://localhost:5501
      NEXT_PUBLIC_MILVUS_API_URL: http://localhost:5502/api
    ports:
      - "3001:3000"
    depends_on:
      - helpdesk-backend
      - chatbot-data-service
      - chatbot-server
    networks:
      - app-network
    develop:
      watch:
        - action: sync
          path: ./helpdesk-frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - "*.log"
        - action: rebuild
          path: ./helpdesk-frontend/package.json
        - action: rebuild
          path: ./helpdesk-frontend/next.config.mjs

volumes:
  mongodb_data:
  etcd_data:
  minio_data:
  uploads_data:

networks:
  app-network:
    driver: bridge 