# This file contains the credentials for the voice & chat platforms
# which your bot is using.
# https://rasa.com/docs/rasa-pro/connectors/messaging-and-voice-channels/

rest:
#  # you don't need to provide anything here - this channel doesn't
#  # require any credentials


#facebook:
#  verify: "<verify>"
#  secret: "<your secret>"
#  page-access-token: "<your page access token>"

#slack:
#  slack_token: "<your slack token>"
#  slack_channel: "<the slack channel>"
#  slack_signing_secret: "<your slack signing secret>"

socketio:
  user_message_evt: user_uttered        # Event name Rasa listens for user messages
  bot_message_evt: bot_uttered         # Event name Rasa sends bot responses on
  session_persistence: true           # Keep conversation state across restarts (true) or reset (false)
  socketio_path: /socket.io            # The path for the Socket.IO endpoint (default is usually fine)
  cors_allowed_origins: "*"

#mattermost:
#  url: "https://<mattermost instance>/api/v4"
#  token: "<bot token>"
#  webhook_url: "<callback URL>"
# Callback input channel configuration
# callback:
  # Verification token Rasa will check in the incoming request's query parameters.
  # Must match RASA_CALLBACK_TOKEN env var used in app.js
  # verify: "pig_shit"

  # Optional: If your Rasa server needs to send responses back via callback (usually not needed for agent messages)
  # url: "URL_where_rasa_sends_responses"

  # Optional: JWT based verification (alternative to 'verify')
  # secret: "your_jwt_secret"
  # audience: "rasa_client"

# This entry is needed if you are using Rasa Enterprise. The entry represents credentials
# for the Rasa Enterprise "channel", i.e. Talk to your bot and Share with guest testers.
rasa:
  url: "http://localhost:5002/api"
