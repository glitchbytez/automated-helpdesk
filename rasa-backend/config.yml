    model_group: openai-gpt-4o
  embeddings:
    model_group: openai_text_embedding
  prompt: prompts/enterprise-search-policy-template.jinja2
  max_history: 0
  max_messages_in_query: 1
#  confidence_threshold: 0.7
  max_results: 3