pipeline:
- name: CompactLLMCommandGenerator
  llm:
    model_group: openai-gpt-4o
  flow_retrieval:
    embeddings:
      model_group: openai_text_embedding

policies:
- name: FlowPolicy
- name: IntentlessPolicy
  llm: 
    model_group: openai-gpt-4o
  embeddings:
    model_group: openai_text_embedding
- name: EnterpriseSearchPolicy
  vector_store:
    type: milvus
    host: milvus
    port: 19530
    collection: test
    user: rasa
    password: rasa@123
    threshold: 1.0
