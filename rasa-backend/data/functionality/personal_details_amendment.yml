flows:
  personal_details_amendment:
    description: Handle requests to amend personal details like gender, date of birth, ID number
    steps:
      - action: utter_personal_details_intro
      
      - collect: user_email
        description: User's email address for ticket creation
        rejections:
          - if: not (slots.user_email matches "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$")
            utter: utter_invalid_email
      
      - collect: registration_number
        description: User's registration number (e.g., R236992Y)
        rejections:
          - if: not (slots.registration_number matches "^[Rr][0-9]{6}[A-Za-z]$")
            utter: utter_invalid_registration_number
      
      - collect: details_to_amend
        description: Which personal details need to be amended
        rejections:
          - if: not (slots.details_to_amend matches "^(gender|date_of_birth|id_number|name|address|contact_details|multiple_details)$")
            utter: utter_invalid_detail_type
      
      - collect: current_details
        description: Current details on file that need to be changed
      
      - collect: correct_details
        description: Correct details that should be updated
      
      - collect: supporting_documents
        description: Supporting documents attached (Birth Certificate, National ID, etc.)
      
      - action: action_create_personal_details_ticket 